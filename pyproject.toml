[project]
name = "lynx-harness"
version = "0.1.0"
description = "Small-model-first agent harness POC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.34"]
eval = ["pyyaml>=6.0,<7"]

[project.scripts]
lynx = "lynx_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lynx_harness"]
